model:
  model_id: translator
  input_channels: 128
  output_channels: 16
  input_size: 4
  output_size: 64
  n_same_per_stage: 5
  d_model: 256
  group_size: 8
  ftemporal: 4

  owl_landscape_size: [360, 640]
  wan_square_size: [512, 512]

  # AE load locations (used in OnlineLatentTrainer.load)
  wan_repo: "Wan-AI/Wan2.1-VACE-14B-diffusers"   # subfolder "vae" is hardcoded in code

  vae_cfg_path: /mnt/data/shahbuland/owl-vaes/configs/feats_c128/cod_128x.yml
  vae_ckpt_path: /mnt/data/checkpoints/owl_vaes/cod_128x_30k_ema.pt

train:
  trainer_id: translator

  data_id: cod_latent
  data_kwargs:
    window_length: 5  # size of single ground truth start tokens
    dataset_path: /mnt/data/lapp0/npy_datasets/BlackOpsColdWar/train
    batch_columns: ["rgb"]

  sample_data_id: cod_latent
  sample_data_kwargs:
    window_length: 5  # size of single ground truth start tokens
    dataset_path: /mnt/data/lapp0/npy_datasets/BlackOpsColdWar/train
    batch_columns: ["rgb"]

  target_batch_size: 64
  batch_size: 8

  epochs: 200

  opt: AdamW
  opt_kwargs:
    lr: 3.0e-5
    weight_decay: 1.0e-4
    betas: [0.9, 0.95]
    eps: 1.0e-15

  lpips_type: convnext
  loss_weights:
    kl: 0.0
    lpips: 12.0
    l2: 1.0
    dwt: 0.0
    crt: 4.0

  scheduler: LinearWarmup
  scheduler_kwargs:
    warmup_steps: 3000
    min_lr: 3.0e-6

  checkpoint_dir: checkpoints/cod_128x_wan_translator
  resume_ckpt: null

  sample_interval: 1000
  save_interval: 5000

wandb:
  name: louiscastricato  # lapp0-andrew-lapp
  project: video_models  # owl
  run_name: distill_wan
